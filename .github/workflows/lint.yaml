---
name: Lint

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      # yamllint from the flake's nixpkgs: pinned by flake.lock, updated with it
      - name: yamllint
        run: nix run --inputs-from . nixpkgs#yamllint -- --strict .

  # Merge Dependabot pull requests once lint passed (releases are at least 7 days old, see dependabot.yml)
  dependabot-merge:
    needs: yamllint
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        run: gh pr merge --squash "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
