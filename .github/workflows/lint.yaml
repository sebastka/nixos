---
name: Lint

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      # yamllint from the flake's nixpkgs: pinned by flake.lock, updated with it
      - name: yamllint
        run: nix run --inputs-from . nixpkgs#yamllint -- --strict .
