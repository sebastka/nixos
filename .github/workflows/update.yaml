---
name: Update dependencies

'on':
  schedule:
    - cron: "0 2 * * *"  # Every night, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # The updates are uncommitted on purpose: don't warn on every Nix command
  NIX_CONFIG: warn-dirty = false

jobs:
  # Update flake.lock and pkgs/, and hand the changes over as a patch
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Update flake.lock and pkgs
        run: ./scripts/update.sh > "${RUNNER_TEMP}/body.md"

      - id: diff
        name: Export changes
        run: |
          git diff > "${RUNNER_TEMP}/update.patch"
          if [ -s "${RUNNER_TEMP}/update.patch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: update
          path: |
            ${{ runner.temp }}/update.patch
            ${{ runner.temp }}/body.md

  # Fail before opening the pull request if an update breaks a host's evaluation or a package.
  # `nix flake check` builds pkgs/ for the runner's system, then every host is evaluated.
  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        runner:
          - ubuntu-latest     # x86_64-linux
          - ubuntu-26.04-arm  # aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Apply changes
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Check
        run: nix flake check --print-build-logs

      # `nix flake check` doesn't fully evaluate NixOS configurations (it let a broken boreas through).
      # Same result on any system: run it once.
      - name: Evaluate hosts
        if: runner.arch == 'X64'
        run: |
          for host in hosts/*/; do
            host="$(basename "${host}")"
            echo "Evaluating ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo
          done

  pull-request:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Apply changes
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: automated/update-dependencies
          delete-branch: true
          sign-commits: true  # Commit through the GitHub API, signed by GitHub: "Verified"
          commit-message: "chore: Update flake.lock and pkgs"
          title: "chore: Update flake.lock and pkgs"
          body-path: ${{ runner.temp }}/update/body.md

      # Already checked on both systems by the check job
      - name: Merge
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh pr merge --squash "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
