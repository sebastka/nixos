---
name: Update dependencies

'on':
  schedule:
    - cron: "0 2 * * *"  # Every night, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  # The updates are uncommitted on purpose: don't warn on every Nix command
  NIX_CONFIG: warn-dirty = false

jobs:
  # Update flake.lock and pkgs/, and hand the changes over as a patch
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3

      - name: Update flake.lock and pkgs
        run: ./bin/update > "${RUNNER_TEMP}/body.md"

      - id: diff
        name: Export changes
        run: |
          git diff > "${RUNNER_TEMP}/update.patch"
          if [ -s "${RUNNER_TEMP}/update.patch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: update
          path: |
            ${{ runner.temp }}/update.patch
            ${{ runner.temp }}/body.md

  # Opened as the sebastka-dependabot-merge GitHub App (as Dependabot's merges, ci.yaml), not with GITHUB_TOKEN: a pull
  # request it opens triggers no workflow, so CI wouldn't check it. Its private key: the Actions secret
  # DEPENDABOT_MERGE_APP_PRIVATE_KEY (a copy of the Dependabot secret of the same name).
  pull-request:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions: {}  # Everything goes through the app's token
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: Iv23liOVKxCEENn5avjB  # sebastka-dependabot-merge
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          # Only what opening and merging the pull request needs, for this repository
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Apply changes
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automated/update-dependencies
          delete-branch: true
          sign-commits: true  # Commit through the GitHub API, signed by GitHub: "Verified"
          commit-message: "chore: Update flake.lock and pkgs"
          title: "chore: Update flake.lock and pkgs"
          body-path: ${{ runner.temp }}/update/body.md

      # Merged by GitHub once CI's checks pass on both systems (required by master's ruleset, "Protect master"), as the
      # app: its push to master triggers the cache's build (cache.yaml). The branch is then deleted (the repository's
      # setting); the next run makes it again.
      - name: Auto-merge
        if: contains(fromJSON('["created", "updated"]'), steps.pr.outputs.pull-request-operation)
        run: gh pr merge --auto --squash "${PR_NUMBER}"
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
