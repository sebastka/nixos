---
name: Update dependencies

'on':
  schedule:
    - cron: "0 2 * * *"  # Every night, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Update flake.lock and pkgs/, and hand the changes over as a patch
  update:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Update flake.lock and pkgs
        run: ./scripts/update.sh > "${RUNNER_TEMP}/body.md"

      - id: diff
        name: Export changes
        run: |
          git diff > "${RUNNER_TEMP}/update.patch"
          if [ -s "${RUNNER_TEMP}/update.patch" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: update
          path: |
            ${{ runner.temp }}/update.patch
            ${{ runner.temp }}/body.md

  # Fail before opening the pull request if an update breaks a host's evaluation or a package.
  # `nix flake check` evaluates every host and builds pkgs/ for the runner's system.
  check:
    needs: update
    if: needs.update.outputs.changed == 'true'
    strategy:
      matrix:
        runner:
          - ubuntu-24.04      # x86_64-linux
          - ubuntu-24.04-arm  # aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Apply changes
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: Check
        run: nix flake check --print-build-logs

  pull-request:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: update
          path: ${{ runner.temp }}/update

      - name: Apply changes
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: automated/update-dependencies
          delete-branch: true
          commit-message: "chore: Update flake.lock and pkgs"
          title: "chore: Update flake.lock and pkgs"
          body-path: ${{ runner.temp }}/update/body.md
