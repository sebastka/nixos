---
name: CI

'on':
  push:
    branches:
      - master  # Other branches are checked through their pull request
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      # Tools from the flake's devShell (same as locally with direnv): pinned by flake.lock
      - name: yamllint
        run: nix develop --command yamllint --strict .

      - name: shellcheck
        run: nix develop --command shellcheck scripts/*.sh

  # Evaluate every host and build pkgs/, natively on both systems
  flake-check:
    strategy:
      matrix:
        runner:
          - ubuntu-latest  # x86_64-linux
          - ubuntu-26.04-arm  # aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: nix flake check
        run: nix flake check --print-build-logs

  # Merge Dependabot pull requests once all checks passed (releases are at least 7 days old, see dependabot.yml)
  dependabot-merge:
    needs:
      - yamllint
      - flake-check
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge
        run: gh pr merge --squash "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
