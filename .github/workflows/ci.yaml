---
name: CI

'on':
  push:
    branches:
      - master  # Other branches are checked through their pull request
  pull_request:

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      # Tools from the flake's devShell (same as locally with direnv): pinned by flake.lock
      - name: yamllint
        run: nix develop --command yamllint --strict .

      - name: shellcheck
        run: nix develop --command shellcheck bin/* users/*/scripts/*.sh

  # Evaluate every host and build pkgs/, natively on both systems
  flake-check:
    strategy:
      matrix:
        runner:
          - ubuntu-latest  # x86_64-linux
          - ubuntu-26.04-arm  # aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1

      - name: nix flake check
        run: nix flake check --print-build-logs

      # `nix flake check` doesn't fully evaluate NixOS configurations
      # Same result on any system: run it once.
      - name: Evaluate hosts
        if: runner.arch == 'X64'
        run: |
          for host in hosts/*/; do
            host="$(basename "${host}")"
            echo "Evaluating ${host}"
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
            echo
          done

  # Merge Dependabot pull requests once all checks passed (releases are at least 7 days old, see dependabot.yml).
  # As the sebastka-dependabot-merge GitHub App (installed on this repository only): GITHUB_TOKEN can never change
  # .github/workflows, which every github-actions update does. Its private key: the Dependabot secret
  # DEPENDABOT_MERGE_APP_PRIVATE_KEY (workflows run by Dependabot get those, not the Actions secrets).
  dependabot-merge:
    needs:
      - yamllint
      - flake-check
    if: >-
      github.event_name == 'pull_request'
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions: {}  # Everything goes through the app's token
    steps:
      - name: App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          # app-id: 5367147  # Deprecated input, for client-id
          client-id: Iv23liOVKxCEENn5avjB  # sebastka-dependabot-merge
          private-key: ${{ secrets.DEPENDABOT_MERGE_APP_PRIVATE_KEY }}
          # Only what merging needs, for this repository
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Merge
        run: gh pr merge --squash "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
