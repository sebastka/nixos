---
# Builds each host's system and pushes it to our binary cache (pithos, modules/nixos/common/nix-cache.nix): hosts then
# download what cache.nixos.org lacks instead of building it. x86_64 hosts on our runners (talmox-nix: ARC in
# sebastka/homelab, image sebastka/nix-actions-runner); aarch64 ones on GitHub's (no aarch64 node of ours), which reach
# Attic through its public route (sebastka/homelab: k8s/applications/utils/attic; its tokens decide who reads and
# writes). hermes: once installed.
#
# Never on pull requests: our runners run jobs unsandboxed, in our cluster, and every job gets ATTIC_TOKEN (a push
# token).
name: Binary cache

'on':
  push:
    branches:
      - master
  # After the nightly update: it merges with GITHUB_TOKEN, which triggers no push event. Before the servers' upgrade
  # window (system.autoUpgrade, 04:00-06:00).
  workflow_run:
    workflows: [Update dependencies]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Our Attic server, its cache and the cache's public key (as modules/nixos/common/nix-cache.nix)
env:
  ATTIC_URL: https://attic.karlsen.app
  ATTIC_CACHE: pithos
  ATTIC_PUBLIC_KEY: pithos:pir3vRe6RpQrNmkwB6M0F/ydWPDgQqe5v6mABkmCpYc=

jobs:
  build:
    # The update must have succeeded (it merged), and only for this repository's own runs
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        host: [geras, zeus, helios, file]
        runner: [talmox-nix]
        include:
          # GitHub's arm runner (4 CPUs): the Asahi kernel and unstable's Node.js are built there, ~3 h the first time
          - {host: boreas, runner: ubuntu-26.04-arm, hosted: true}
    runs-on: ${{ matrix.runner }}
    # GitHub's runners stop at 6 h
    timeout-minutes: ${{ matrix.hosted && 350 || 240 }}
    # The latest commit only: a newer run replaces a host's older one
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.host }}
      cancel-in-progress: true
    steps:
      # master's head: a workflow_run event's own checkout would be the update workflow's commit, before its merge
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: master

      # GitHub's runners: room for the system's closure and its builds (~30 GB; the runner has ~15 GB free), by removing
      # preinstalled toolchains we don't use; then Nix (ours have it, and the Attic client, in their image)
      - name: Free disk space
        if: matrix.hosted
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
            /usr/local/share/powershell /usr/share/swift /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
        if: matrix.hosted
      - name: Install the Attic client
        if: matrix.hosted
        run: |
          attic="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#attic-client)"
          echo "${attic}/bin" >> "${GITHUB_PATH}"

      # Our cache as a substituter too (a rebuild reuses what is already there): private, so the token in a netrc
      # file, outside the workspace
      - name: Configure the cache
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/netrc"
          printf 'machine %s\npassword %s\n' "${ATTIC_URL#https://}" "${ATTIC_TOKEN}" > "${RUNNER_TEMP}/netrc"
          {
            echo 'NIX_CONFIG<<EOF'
            echo "extra-substituters = ${ATTIC_URL}/${ATTIC_CACHE}"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
            echo "netrc-file = ${RUNNER_TEMP}/netrc"
            echo 'EOF'
          } >> "${GITHUB_ENV}"
          attic login karlsen "${ATTIC_URL}" "${ATTIC_TOKEN}"

      # Unchanged system (its store path already in our cache, pushed by an earlier run: it's ours alone, never in
      # cache.nixos.org): no build, which in this empty store would download all of it for nothing
      - id: cached
        name: Already cached?
        run: |
          out="$(nix eval --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.outPath")"
          if nix path-info --store "${ATTIC_URL}/${ATTIC_CACHE}" "${out}" >/dev/null 2>&1; then
            echo "${out}: already cached"
            echo "cached=true" >> "${GITHUB_OUTPUT}"
          fi

      # --keep-going: a failed derivation doesn't stop the others, so they can still be pushed
      - id: build
        name: Build ${{ matrix.host }}
        if: steps.cached.outputs.cached != 'true'
        run: >-
          nix build --keep-going --print-build-logs --out-link result
          ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      # Its whole closure: what cache.nixos.org already has is skipped (the cache's upstream key). Two uploads at a time
      # per job: Attic chunks and compresses each in memory, and several jobs push at once (OOM-killed by the default).
      # A failed build still pushes what it built (the existing outputs of the system's derivations), or a single broken
      # derivation would leave the host to build hundreds of others itself; the job stays failed.
      - name: Push ${{ matrix.host }}
        if: ${{ !cancelled() && steps.cached.outputs.cached != 'true' }}
        run: |
          if [ "${{ steps.build.outcome }}" = success ]; then
            attic push --jobs 2 "karlsen:${ATTIC_CACHE}" result
          else
            drv="$(nix eval --raw ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath")"
            nix-store --query --requisites --include-outputs "${drv}" | grep -v '\.drv$' \
              | xargs --no-run-if-empty attic push --jobs 2 "karlsen:${ATTIC_CACHE}"
          fi
