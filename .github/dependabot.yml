---
version: 2

updates:
  # Keep the actions used in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only propose releases at least 7 days old (compromised releases are usually caught by then):
    # pull requests are auto-merged, see .github/workflows/ci.yaml
    cooldown:
      default-days: 7
