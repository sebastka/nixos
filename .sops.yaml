# yamllint disable rule:line-length
# Update keys:
# for f in secrets/*.sops.yaml; do sops updatekeys "$f"; done
---
keys:
  # sebastian@karlsen.fr
  - &sebastian 0B25B26C537B40B5B208F3A6C74C02E66D0CBECF

  # Host age keys (derived from SSH host keys) used by each host to decrypt at activation
  # To add a new host: $ cat /etc/ssh/ssh_host_ed25519_key.pub | ssh-to-age
  - &helios age18vs7mlzppnv3400sp62puhtv07myjmra6k44lx27e07xcpw3c4csnddd4y
  - &geras age1q7nfvyrnh4cjt8yuzecvn9lhpfwpkw29anfctltu8e7qww75ssfqpnynva
  - &zeus age1s7un05umqftr0p49skvjuvzwvuc4amtt6u4hy8f56flk34pnjsrslxsf76
  - &hermes age1q98mdl6dv8j75nhtvensqfq4l8942utenxuc8ptscqxru5uwn3xqgc9qmj
  - &boreas age1pz30l5agzdnhc23vvmsc836d9h7d9ys4kz9k9n33r3wyhzks4yus8vnrmc

creation_rules:
  - {path_regex: 'secrets/\.?[^/]*-(ssh-host-key|secure-boot)\.sops\.yaml$', key_groups: [{pgp: [*sebastian]}]}
  - {path_regex: 'secrets/\.?common\.sops\.yaml$',  key_groups: [{pgp: [*sebastian], age: [*geras, *zeus, *hermes, *boreas, *helios]}]}
  - {path_regex: 'secrets/\.?desktop\.sops\.yaml$', key_groups: [{pgp: [*sebastian], age: [*geras, *zeus, *boreas]}]}
  - {path_regex: 'secrets/\.?tern\.sops\.yaml$',    key_groups: [{pgp: [*sebastian], age: [*geras, *zeus, *boreas]}]}
  - {path_regex: 'secrets/\.?ssh-work\.sops\.yaml$', key_groups: [{pgp: [*sebastian], age: [*geras, *zeus, *boreas]}]}
  - {path_regex: 'secrets/\.?work\.sops\.yaml$',    key_groups: [{pgp: [*sebastian], age: [*geras, *zeus, *boreas]}]}
  - {path_regex: 'secrets/\.?helios\.sops\.yaml$',  key_groups: [{pgp: [*sebastian], age: [*helios]}]}
